name: Prepare
description: Prepares CI environment

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22'
  install-npm:
    description: Install a working npm
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Read pnpm version from package.json
      id: pnpm-version
      shell: bash
      run: echo "version=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        # TODO remove the explicit version after https://github.com/pnpm/action-setup/issues/227 is fixed
        version: ${{ steps.pnpm-version.outputs.version }}
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        cache: pnpm
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org # Required for Trusted Publishing
    - name: Install dependencies
      shell: bash
      run: pnpm ci
    - name: Check deps for vulnerabilities
      shell: bash
      run: pnpm deps:audit
    - name: Install a working npm
      shell: bash
      if: inputs.install-npm == 'true'
      run: |
        # The npm bundled with the runner's Node.js may have missing internal
        # dependencies (e.g. `promise-retry`), making `npm install` itself crash.
        # Bootstrap by downloading the npm tarball directly and using that fresh
        # copy to perform the global install.
        NPM_VER=$(curl -fsSL https://registry.npmjs.org/-/package/npm/dist-tags | jq -r '.latest')
        curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VER}.tgz" | tar -xzC /tmp/
        node /tmp/package/bin/npm-cli.js install --global "npm@${NPM_VER}"
