# cspell:ignore EBADDEVENGINES
name: Check code (+ Publish)
on:
  pull_request:
  push:
    branches:
      - main
      - feat/scoped-package-publishing # Publishes the scoped package

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for Trusted Publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/prepare

  knip:
    name: Knip
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/prepare
      - run: pnpm knip

  spellcheck:
    name: Spellcheck (cspell)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/prepare
      - run: pnpm spellcheck

  formatting:
    name: Formatting check (prettier)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/prepare
      - run: pnpm format:check

  typecheck:
    name: Typecheck (tsgo)
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/prepare
      - run: pnpm lint:types

  eslint:
    name: ESLint
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/prepare
      - run: pnpm lint:eslint

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: install
    strategy:
      matrix:
        os: [ubuntu-24.04]
        node-version: [22, 24, 26]
        # Only run Windows tests on the latest Node version
        include:
          - os: windows-2025
            node-version: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/prepare
        with:
          node-version: ${{ matrix.node-version }}
      # `test/tsconfig.json` references the composite `src` project; vitest's
      # typecheck needs its declarations built first or `@/*` imports resolve to `any`.
      - run: pnpm lint:types
      - run: pnpm test:vitest

  build:
    name: Build (tsdown, attw + publint) & check published types
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/prepare
      # `tsdown` runs `attw` and `publint` with `failOnWarn`, so this also lints
      # the public types. The consumer check needs the built `dist/`.
      - run: pnpm build
      - run: pnpm test:types:consumer

  release:
    name: Create release PR _OR_ Publish on merge
    needs: [knip, spellcheck, formatting, typecheck, eslint, test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare
        with:
          install-npm: 'true'
      # Based on https://github.com/changesets/action/issues/303#issuecomment-1888167265
      - name: Capture new release version
        run: |
          pnpm changeset version
          echo "NEW_VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV
          git restore .
      - name: Create release / Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Chooses the scoped vs. unscoped name by branch, without touching
          # `package.json`; see `scripts/publish.ts` for why.
          publish: node scripts/publish.ts
          commitMode: github-api
          title: 'chore: release v${{ env.NEW_VERSION }}'
          commit: 'chore: release v${{ env.NEW_VERSION }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_FORCE: true # To prevent potential EBADDEVENGINES npm fatal error
