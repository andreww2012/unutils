saveExact: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExclude:
  - eslint-config-un@1.0.0-beta.14

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: []

allowBuilds:
  lefthook@2.1.9: true
  unrs-resolver@1.12.2: false

dedupePeers: true
strictPeerDependencies: false

overrides:
  '@arethetypeswrong/core@0.18.2>fflate': 0.8.2 # TODO https://github.com/arethetypeswrong/arethetypeswrong.github.io/issues/258 cspell:disable-line
  # GHSA-fx2h-pf6j-xcff cspell:disable-line
  # Can't use range like `^8.0.16` as pnpm won't re-resolve the already-locked vite for a range replacement, only for an exact one
  vite@>=8.0.0 <8.0.16: 8.0.16

peerDependencyRules:
  allowedVersions:
    eslint-config-un@1.0.0-beta.11>@e18e/eslint-plugin: '^0.4.1 || ^0.5.0'

patchedDependencies:
  arkregex@0.0.6: patches/arkregex@0.0.6.patch
  remeda: patches/remeda.patch
