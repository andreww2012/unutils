saveExact: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExclude: []

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: []

allowBuilds:
  lefthook@2.1.10: true
  unrs-resolver@1.12.2: false

dedupePeers: true
strictPeerDependencies: false

overrides:
  # The `typescript-7` alias pulls the real `typescript@7` that does not expose the API yet
  eslint-plugin-sonarjs>typescript: 'npm:@typescript/typescript6@6.0.2'
  # GHSA-fx2h-pf6j-xcff cspell:disable-line
  # Can't use range like `^8.0.16` as pnpm won't re-resolve the already-locked vite for a range replacement, only for an exact one
  vite@>=8.0.0 <8.0.16: 8.0.16

peerDependencyRules:
  allowedVersions:
    eslint-config-un@1.0.0-beta.11>@e18e/eslint-plugin: '^0.4.1 || ^0.5.0'

patchedDependencies:
  arkregex@0.0.8: patches/arkregex@0.0.8.patch
  remeda: patches/remeda.patch
